resources:
  apps:
    governance_mcp:
      name: "governance-mcp-${bundle.target}"
      description: "Databricks Governance MCP Server"

      source_code_path: ../src/mcp_app

      config:
        command:
          - "python"
          - "app.py"
        env:
        - name: DATABRICKS_HOST
          value: "https://dbc-e3761da8-7d95.cloud.databricks.com"
        - name: DATABRICKS_HTTP_PATH
          value: "{{secrets/agents_scope/http_path}}"
        - name: DATABRICKS_TOKEN
          value: "{{secrets/agents_scope/databricks_token}}"

      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE