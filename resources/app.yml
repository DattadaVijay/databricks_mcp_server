resources:
  apps:
    governance_mcp:
      name: "governance-mcp-${bundle.target}"
      description: "Databricks Governance MCP Server"

      source_code_path: ../src/mcp_app

      config:
        command:
          - "python"
          - "app.py"

      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE